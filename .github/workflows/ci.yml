name: Full-Stack CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up C++ Compiler (GCC)
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential g++

    - name: Compile Core C++ DPI Engine
      run: |
        cd Packet_analyzer
        g++ -std=c++17 -pthread -O2 -I include -o dpi_engine \
            src/dpi_mt.cpp \
            src/pcap_reader.cpp \
            src/packet_parser.cpp \
            src/sni_extractor.cpp \
            src/types.cpp
        chmod +x dpi_engine
        ./dpi_engine test_dpi.pcap filtered_ci.pcap --json-output test_ci.json

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Backend Dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Backend Integration Tests
      run: |
        python backend/test_backend.py
        python backend/test_chat_stream.py

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies & Build Next.js
      run: |
        cd frontend
        npm ci
        npm run build
